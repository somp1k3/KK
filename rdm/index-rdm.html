<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KK Радио - Прямой эфир</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        :root {
            --primary-dark: #0a2919;
            --primary-color: #1a472a;
            --primary-light: #2d5a3c;
            --accent-color: #4CAF50;
            --accent-light: #81c784;
            --text-color: #e8f5e9;
            --text-secondary: #c8e6c9;
            --shadow: rgba(0, 0, 0, 0.3);
        }
        
        body {
            background-color: var(--primary-dark);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(26, 71, 42, 0.4) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(76, 175, 80, 0.2) 0%, transparent 20%);
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }
        
        .radio-player {
            background-color: var(--primary-color);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px var(--shadow);
            border: 1px solid rgba(76, 175, 80, 0.2);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .logo-icon {
            font-size: 2.5rem;
            color: var(--accent-color);
        }
        
        .logo-text h1 {
            font-size: 2rem;
            color: var(--accent-light);
            letter-spacing: 1px;
        }
        
        .station-selector {
            margin-bottom: 25px;
        }
        
        .station-selector label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        
        .stations-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        /* Стили для скроллбара */
        .stations-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .stations-container::-webkit-scrollbar-track {
            background: var(--primary-light);
            border-radius: 4px;
        }
        
        .stations-container::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 4px;
        }
        
        .station-btn {
            padding: 12px 15px;
            background-color: var(--primary-light);
            border: 2px solid transparent;
            border-radius: 10px;
            color: var(--text-color);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .station-btn:hover {
            background-color: rgba(76, 175, 80, 0.2);
            transform: translateY(-2px);
        }
        
        .station-btn.active {
            background-color: var(--accent-color);
            color: var(--primary-dark);
            border-color: var(--accent-light);
            font-weight: bold;
        }
        
        .station-icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }
        
        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin: 30px 0;
        }
        
        .play-btn {
            background-color: var(--accent-color);
            color: var(--primary-dark);
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .play-btn:hover {
            background-color: var(--accent-light);
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.6);
        }
        
        .play-btn.playing {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4); }
            50% { box-shadow: 0 5px 25px rgba(76, 175, 80, 0.8); }
            100% { box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4); }
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        
        .volume-slider {
            flex: 1;
            max-width: 250px;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: var(--primary-light);
            outline: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
        }
        
        .track-info {
            background-color: var(--primary-light);
            border-radius: 10px;
            padding: 20px;
            margin-top: 25px;
            text-align: center;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .track-title {
            font-size: 1.3rem;
            color: var(--accent-light);
            margin-bottom: 8px;
        }
        
        .track-artist {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 5px;
        }
        
        .track-station {
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .status {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .loading {
            display: none;
            color: var(--accent-color);
            margin-top: 10px;
            text-align: center;
        }
        
        .error {
            display: none;
            color: #ff6b6b;
            margin-top: 10px;
            text-align: center;
            background-color: rgba(255, 107, 107, 0.1);
            padding: 10px;
            border-radius: 5px;
        }
        
        .station-search {
            margin-bottom: 15px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--primary-light);
            border: 2px solid var(--primary-light);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        .search-input::placeholder {
            color: var(--text-secondary);
        }
        
        .station-count {
            text-align: right;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .radio-player {
                padding: 20px;
            }
            
            .stations-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                max-height: 250px;
            }
            
            .station-btn {
                font-size: 0.9rem;
                padding: 10px 12px;
            }
        }
        
        @media (max-width: 480px) {
            .stations-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="radio-player">
            <div class="header">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-broadcast-tower"></i>
                    </div>
                    <div class="logo-text">
                        <h1>KK Радио</h1>
                    </div>
                </div>
                <p>Прямой эфир - более 30 радиостанций</p>
            </div>
            
            <div class="station-selector">
                <div class="station-search">
                    <input type="text" class="search-input" id="search-input" placeholder="Поиск радиостанции...">
                </div>
                
                <label>Выберите радиостанцию:</label>
                <div class="stations-container" id="stations-container">
                    <!-- Станции будут добавлены через JavaScript -->
                </div>
                <div class="station-count" id="station-count">Всего станций: 0</div>
            </div>
            
            <div class="player-controls">
                <button class="play-btn" id="play-btn">
                    <i class="fas fa-play" id="play-icon"></i>
                </button>
                
                <div class="volume-control">
                    <i class="fas fa-volume-down"></i>
                    <input type="range" min="0" max="100" value="70" class="volume-slider" id="volume-slider">
                    <i class="fas fa-volume-up"></i>
                </div>
            </div>
            
            <div class="track-info" id="track-info">
                <div class="track-title" id="track-title">Выберите радиостанцию</div>
                <div class="track-artist" id="track-artist">Нажмите кнопку воспроизведения</div>
                <div class="track-station" id="track-station">KK Радио</div>
            </div>
            
            <div class="loading" id="loading">
                <i class="fas fa-spinner fa-spin"></i> Подключение к радиостанции...
            </div>
            
            <div class="error" id="error">
                Ошибка подключения. Попробуйте другую радиостанцию.
            </div>
            
            <div class="status" id="status">
                Готово к воспроизведению
            </div>
        </div>
    </div>

            const volumeSlider = document.getElementById('volume-slider');
            const trackTitle = document.getElementById('track-title');

                },

                // Региональные
                {

                {

                {

                    stream: 'https://nashe1.hostingradio.ru:80/nashe-256',
                    icon: 'fas fa-users',
                    category: 'Российские'
                },
                {
                    id: 'energy',
                    name: 'Energy',
                    stream: 'https://pub0301.101.ru:8443/stream/air/aac/64/100',
                    icon: 'fas fa-bolt',
                    category: 'Российские'
                },
                
                // Интернет-радио
                {

                    name: 'RadioTunes',
                    stream: 'https://listen.radiotunes.com/public1/ambient',
                    icon: 'fas fa-stream',
                    category: 'Интернет'
                },
                {

                    name: 'Sky.FM',
                    stream: 'https://listen.sky.fm/public3/classical',
                    icon: 'fas fa-cloud',
                    category: 'Интернет'
                },
                {
                    id: '181-fm',
                    name: '181.FM',
                    stream: 'https://listen.181fm.com/181-goodtime_128k.mp3',
                    icon: 'fas fa-fm',
                    category: 'Интернет'
                },
                
                // Альтернативные
                {
                    id: 'radio-sputnik',
                    name: 'Радио Спутник',
                    stream: 'https://radiosputnik.hostingradio.ru:8000/radioSputnik256.mp3',
                    icon: 'fas fa-satellite',
                    category: 'Российские'
                },
                {
                    id: 'komsomolskaya',
                    name: 'Комсомольская правда',
                    stream: 'https://kpradio.hostingradio.ru:8000/radioKP256.mp3',
                    icon: 'fas fa-pen-alt',
                    category: 'Новости'
                },
                {
                    id: 'business-fm',
                    name: 'Business FM',
                    stream: 'https://bfm.hostingradio.ru:8004/fm',
                    icon: 'fas fa-chart-line',
                    category: 'Новости'
                }
            ];
            
            // Переменные состояния
            let currentStation = stations[0];
            let isPlaying = false;
            let audio = null;
            let trackUpdateInterval = null;
            let filteredStations = [...stations];
            
            // Инициализация станций в интерфейсе
            function initStations() {
                stationsContainer.innerHTML = '';
                
                filteredStations.forEach(station => {
                    const button = document.createElement('button');
                    button.className = `station-btn ${station.id === currentStation.id ? 'active' : ''}`;
                    button.setAttribute('data-id', station.id);
                    
                    button.innerHTML = `
                        <div class="station-icon">
                            <i class="${station.icon}"></i>
                        </div>
                        <div>
                            <div>${station.name}</div>
                            <div style="font-size: 0.8rem; color: var(--text-secondary);">${station.category}</div>
                        </div>
                    `;
                    
                    button.addEventListener('click', function() {
                        switchStation(station);
                    });
                    
                    stationsContainer.appendChild(button);
                });
                
                stationCount.textContent = `Показано: ${filteredStations.length} из ${stations.length}`;
            }
            
            // Поиск станций
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase().trim();
                
                if (searchTerm === '') {
                    filteredStations = [...stations];
                } else {
                    filteredStations = stations.filter(station => 
                        station.name.toLowerCase().includes(searchTerm) ||
                        station.category.toLowerCase().includes(searchTerm)
                    );
                }
                
                initStations();
            });
            
            // Переключение станции
            function switchStation(station) {
                if (currentStation.id === station.id) return;
                
                // Обновляем активную кнопку
                document.querySelectorAll('.station-btn').forEach(btn => btn.classList.remove('active'));
                event.target.closest('.station-btn').classList.add('active');
                
                // Меняем станцию
                currentStation = station;
                
                // Если воспроизведение было запущено, останавливаем
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    playIcon.classList.remove('fa-pause');
                    playIcon.classList.add('fa-play');
                    playBtn.classList.remove('playing');
                }
                
                // Обновляем информацию о станции
                trackTitle.textContent = 'Загрузка...';
                trackArtist.textContent = 'Подключение к радиостанции';
                trackStation.textContent = station.name;
                statusElement.textContent = 'Смена радиостанции';
                
                // Инициализируем новую станцию
                initAudio();
                
                // Если была включена музыка, запускаем новую станцию
                if (isPlaying) {
                    setTimeout(() => {
                        playAudio();
                    }, 500);
                }
            }
            
            // Инициализация аудио
            function initAudio() {
                if (audio) {
                    audio.pause();
                    audio.src = '';
                }
                
                audio = new Audio();
                audio.crossOrigin = 'anonymous';
                audio.src = currentStation.stream;
                audio.volume = volumeSlider.value / 100;
                
                // Обработчики событий аудио
                audio.addEventListener('playing', function() {
                    isPlaying = true;
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.add('fa-pause');
                    playBtn.classList.add('playing');
                    loadingElement.style.display = 'none';
                    errorElement.style.display = 'none';
                    statusElement.textContent = 'Идет воспроизведение';
                    updateTrackInfo();
                    
                    // Обновляем информацию о треке каждые 15 секунд
                    if (trackUpdateInterval) clearInterval(trackUpdateInterval);
                    trackUpdateInterval = setInterval(updateTrackInfo, 15000);
                });
                
                audio.addEventListener('waiting', function() {
                    loadingElement.style.display = 'block';
                    statusElement.textContent = 'Буферизация...';
                });
                
                audio.addEventListener('error', function(e) {
                    console.error('Audio error:', e);
                    isPlaying = false;
                    playIcon.classList.remove('fa-pause');
                    playIcon.classList.add('fa-play');
                    playBtn.classList.remove('playing');
                    loadingElement.style.display = 'none';
                    errorElement.style.display = 'block';
                    statusElement.textContent = 'Ошибка подключения';
                });
            }
            
            // Обновление информации о текущем треке
            async function updateTrackInfo() {
                // Для большинства станций будем использовать общую информацию
                const trackTemplates = [
                    { title: "Текущий хит", artist: "Популярные исполнители" },
                    { title: "Музыка для вас", artist: "Лучшие треки" },
                    { title: "Прямой эфир", artist: "Радиостанция в прямом эфире" },
                    { title: "Слушайте онлайн", artist: "Прямая трансляция" }
                ];
                
                // Для некоторых станций можно получить реальную информацию
                if (currentStation.id === 'radio-shokolad') {
                    try {
                        const response = await fetch('https://api.allorigins.win/raw?url=https://radiorecord.ru/api/stations/now/chocolate');
                        const data = await response.json();
                        if (data && data.result) {
                            trackTitle.textContent = data.result.title || 'Текущий трек';
                            trackArtist.textContent = data.result.artist || currentStation.name;
                            trackStation.textContent = currentStation.name;
                            return;
                        }
                    } catch (error) {
                        console.log('Не удалось получить информацию о треке');
                    }
                }
                
                // Общий случай - случайный шаблон
                const randomTemplate = trackTemplates[Math.floor(Math.random() * trackTemplates.length)];
                trackTitle.textContent = randomTemplate.title;
                trackArtist.textContent = randomTemplate.artist;
                trackStation.textContent = currentStation.name;
            }
            
            // Кнопка воспроизведения/паузы
            playBtn.addEventListener('click', function() {
                if (!audio) {
                    initAudio();
                }
                
                if (isPlaying) {
                    // Пауза
                    audio.pause();
                    isPlaying = false;
                    playIcon.classList.remove('fa-pause');
                    playIcon.classList.add('fa-play');
                    playBtn.classList.remove('playing');
                    statusElement.textContent = 'Пауза';
                    
                    if (trackUpdateInterval) {
                        clearInterval(trackUpdateInterval);
                        trackUpdateInterval = null;
                    }
                } else {
                    // Воспроизведение
                    playAudio();
                }
            });
            
            // Функция запуска воспроизведения
            function playAudio() {
                loadingElement.style.display = 'block';
                errorElement.style.display = 'none';
                statusElement.textContent = 'Подключение...';
                
                audio.play().catch(error => {
                    console.error('Play error:', error);
                    loadingElement.style.display = 'none';
                    errorElement.style.display = 'block';
                    statusElement.textContent = 'Ошибка подключения';
                    
                    // Попробуем использовать альтернативный поток
                    if (currentStation.id === 'radio-shokolad') {
                        audio.src = 'https://radiokrug.ru/radio/3790/radio.mp3';
                        setTimeout(() => {
                            audio.play().catch(e => console.error('Second attempt failed:', e));
                        }, 1000);
                    }
                });
            }
            
            // Контроль громкости
            volumeSlider.addEventListener('input', function() {
                if (audio) {
                    audio.volume = this.value / 100;
                }
            });
            
            // Инициализация при загрузке
            initStations();
            initAudio();
            updateTrackInfo();
            
            // Установка заголовка трека по умолчанию
            trackStation.textContent = currentStation.name;
        });
    </script>
</body>
</html>
