<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Права на Var1ki </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, 
                #8B4513 0%, 
                #CD7F32 30%, 
                #D2691E 70%, 
                #A0522D 100%);
            color: #F5DEB3;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(139, 69, 19, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(205, 127, 50, 0.3) 0%, transparent 50%);
            z-index: -1;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background-color: rgba(50, 25, 10, 0.85);
            border-radius: 25px;
            padding: 40px 30px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            backdrop-filter: blur(5px);
            border: 2px solid #D2691E;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, 
                #D2691E, #CD7F32, #8B4513, #D2691E);
            z-index: 1;
        }
        
        .header {
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 3px solid #CD7F32;
            position: relative;
        }
        
        .header::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 25%;
            width: 50%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #F5DEB3, transparent);
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: #F5DEB3;
            text-shadow: 
                0 2px 5px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(205, 127, 50, 0.5);
            letter-spacing: 2px;
            font-weight: bold;
        }
        
        .subtitle {
            font-size: 1.3rem;
            color: #D2B48C;
            font-style: italic;
            letter-spacing: 1px;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 35px;
            margin-bottom: 20px;
        }
        
        .link-item {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, 
                rgba(139, 69, 19, 0.9) 0%, 
                rgba(160, 82, 45, 0.9) 50%, 
                rgba(205, 127, 50, 0.9) 100%);
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: #F5DEB3;
            transition: all 0.4s ease;
            border: 2px solid #8B4513;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            min-height: 150px;
        }
        
        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.1), 
                transparent);
            transition: left 0.8s ease;
        }
        
        .link-item:hover::before {
            left: 100%;
        }
        
        .link-item:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 
                0 20px 30px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(205, 127, 50, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border-color: #D2691E;
            background: linear-gradient(135deg, 
                rgba(160, 82, 45, 0.95) 0%, 
                rgba(205, 127, 50, 0.95) 50%, 
                rgba(210, 105, 30, 0.95) 100%);
        }
        
        .link-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-right: 30px;
            flex-shrink: 0;
            background: rgba(50, 25, 10, 0.8);
            border: 3px solid #D2691E;
            box-shadow: 
                0 0 20px rgba(210, 105, 30, 0.5),
                inset 0 0 10px rgba(255, 255, 255, 0.1);
            color: #F5DEB3;
        }
        
        .website .link-icon {
            background: linear-gradient(135deg, #DAA520, #FFD700);
            border-color: #FFD700;
        }
        
        .telegram .link-icon {
            background: linear-gradient(135deg, #0088cc, #34b7f1);
            border-color: #34b7f1;
        }
        
        .steam .link-icon {
            background: linear-gradient(135deg, #171a21, #66c0f4);
            border-color: #66c0f4;
        }
        
        .discord .link-icon {
            background: linear-gradient(135deg, #5865f2, #7289da);
            border-color: #7289da;
        }
        
        .link-content {
            text-align: left;
            flex-grow: 1;
        }
        
        .link-title {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
        }
        
        .link-url {
            color: #D2B48C;
            font-size: 1.2rem;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        
        .link-arrow {
            font-size: 32px;
            opacity: 0.7;
            transition: all 0.3s ease;
            color: #FFD700;
            margin-left: 20px;
        }
        
        .link-item:hover .link-arrow {
            transform: translateX(10px);
            opacity: 1;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }
        
        .footer {
            margin-top: 40px;
            color: #D2B48C;
            font-size: 1rem;
            padding-top: 25px;
            border-top: 2px solid #8B4513;
            font-style: italic;
        }
        
        .bronze-decoration {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .bronze-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #CD7F32;
            box-shadow: 0 0 10px #D2691E;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 2.8rem;
            }
            
            .link-item {
                padding: 25px 20px;
                min-height: 130px;
            }
            
            .link-icon {
                width: 70px;
                height: 70px;
                font-size: 30px;
                margin-right: 20px;
            }
            
            .link-title {
                font-size: 1.8rem;
            }
            
            .link-url {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 576px) {
            .container {
                padding: 25px 15px;
            }
            
            h1 {
                font-size: 2.3rem;
            }
            
            .link-item {
                flex-direction: column;
                text-align: center;
                padding: 30px 20px;
            }
            
            .link-icon {
                margin-right: 0;
                margin-bottom: 20px;
            }
            
            .link-content {
                text-align: center;
                margin-bottom: 15px;
            }
            
            .link-arrow {
                margin-left: 0;
                margin-top: 10px;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
        }
        
        /* Эффект металлического блеска */
        .metal-shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to bottom right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.1) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .link-item:hover .metal-shine {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Var1ki</h1>
            <p class="subtitle">Бронзовый портал в цифровой мир</p>
        </div>
        
        <div class="links">
            <a href="https://somp1k3.github.io" class="link-item website" target="_blank">
                <div class="metal-shine"></div>
                <div class="link-icon">
                    <i class="fas fa-home"></i>
                </div>
                <div class="link-content">
                    <div class="link-title">Основной сайт</div>
                    <div class="link-url">https://somp1k3.github.io</div>
                </div>
                <div class="link-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </a>
            
            <a href="https://t.me/Var1ki" class="link-item telegram" target="_blank">
                <div class="metal-shine"></div>
                <div class="link-icon">
                    <i class="fab fa-telegram"></i>
                </div>
                <div class="link-content">
                    <div class="link-title">Telegram</div>
                    <div class="link-url">https://t.me/Var1ki</div>
                </div>
                <div class="link-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </a>
            
            <a href="https://steamcommunity.com/id/Var1ki/" class="link-item steam" target="_blank">
                <div class="metal-shine"></div>
                <div class="link-icon">
                    <i class="fab fa-steam"></i>
                </div>
                <div class="link-content">
                    <div class="link-title">Steam</div>
                    <div class="link-url">https://steamcommunity.com/id/Var1ki/</div>
                </div>
                <div class="link-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </a>
            
            <a href="https://discord.com/users/1118581500389118073" class="link-item discord" target="_blank">
                <div class="metal-shine"></div>
                <div class="link-icon">
                    <i class="fab fa-discord"></i>
                </div>
                <div class="link-content">
                    <div class="link-title">Discord</div>
                    <div class="link-url">ID: 1118581500389118073</div>
                </div>
                <div class="link-arrow">
                    <i class="fas fa-chevron-right"></i>
                </div>
            </a>
        </div>
        
        <div class="bronze-decoration">
            <div class="bronze-dot"></div>
            <div class="bronze-dot"></div>
            <div class="bronze-dot"></div>
            <div class="bronze-dot"></div>
            <div class="bronze-dot"></div>
        </div>
        
        <div class="footer">
            <p>Бронзовый портал • 2023 • Все ссылки ведут к Var1ki</p>
        </div>
    </div>
    
    <script>
        // Добавляем динамический эффект металлического блеска
        document.querySelectorAll('.link-item').forEach(link => {
            link.addEventListener('mouseenter', function() {
                const icon = this.querySelector('.link-icon');
                icon.style.transform = 'scale(1.1) rotate(5deg)';
                icon.style.boxShadow = '0 0 25px rgba(210, 105, 30, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.2)';
                
                // Особый эффект для основного сайта
                if (this.classList.contains('website')) {
                    icon.style.boxShadow = '0 0 30px rgba(255, 215, 0, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.3)';
                }
            });
            
            link.addEventListener('mouseleave', function() {
                const icon = this.querySelector('.link-icon');
                icon.style.transform = 'scale(1) rotate(0deg)';
                icon.style.boxShadow = '0 0 20px rgba(210, 105, 30, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.1)';
                
                // Возвращаем стандартную тень для основного сайта
                if (this.classList.contains('website')) {
                    icon.style.boxShadow = '0 0 20px rgba(255, 215, 0, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.1)';
                }
            });
        });
        
        // Добавляем эффект плавающих частиц бронзового цвета
        function createBronzeParticles() {
            const particlesContainer = document.createElement('div');
            particlesContainer.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1;';
            document.body.appendChild(particlesContainer);
            
            const colors = ['#8B4513', '#CD7F32', '#D2691E', '#A0522D', '#F5DEB3', '#DAA520'];
            
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                const size = Math.random() * 10 + 5;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                particle.style.cssText = `
                    position: absolute;
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    border-radius: 50%;
                    opacity: ${Math.random() * 0.3 + 0.1};
                    top: ${Math.random() * 100}%;
                    left: ${Math.random() * 100}%;
                    box-shadow: 0 0 ${size}px ${color};
                    animation: floatParticle ${Math.random() * 20 + 10}s infinite linear;
                `;
                
                particlesContainer.appendChild(particle);
            }
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes floatParticle {
                    0% {
                        transform: translateY(0) translateX(0) rotate(0deg);
                        opacity: ${Math.random() * 0.3 + 0.1};
                    }
                    33% {
                        transform: translateY(-30vh) translateX(20vw) rotate(120deg);
                        opacity: ${Math.random() * 0.5 + 0.2};
                    }
                    66% {
                        transform: translateY(20vh) translateX(-15vw) rotate(240deg);
                        opacity: ${Math.random() * 0.3 + 0.1};
                    }
                    100% {
                        transform: translateY(0) translateX(0) rotate(360deg);
                        opacity: ${Math.random() * 0.3 + 0.1};
                    }
                }
            `;
            document.head.appendChild(style);
        }
        
        // Запускаем создание частиц после загрузки страницы
        window.addEventListener('DOMContentLoaded', createBronzeParticles);
        
        // Эффект для основного сайта - особое свечение
        const mainSiteLink = document.querySelector('.website');
        if (mainSiteLink) {
            mainSiteLink.addEventListener('mouseenter', function() {
                this.style.boxShadow = 
                    '0 20px 30px rgba(0, 0, 0, 0.6), ' +
                    '0 0 50px rgba(218, 165, 32, 0.6), ' +
                    'inset 0 1px 0 rgba(255, 255, 255, 0.3)';
            });
            
            mainSiteLink.addEventListener('mouseleave', function() {
                this.style.boxShadow = 
                    '0 10px 20px rgba(0, 0, 0, 0.4), ' +
                    'inset 0 1px 0 rgba(255, 255, 255, 0.2)';
            });
        }
    </script>
</body>
</html>
